<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.music.126.net; connect-src 'none'; object-src 'none'"><link rel="stylesheet" href="floating.css"><link rel="stylesheet" href="appearance.css"><link rel="stylesheet" href="floating-polish.css"></head><body class="floating-root">
<section id="panel" class="panel"><div class="heading"><span id="drag-handle" class="drag-handle" title="拖离顶部变为气泡，拖回顶部停靠">⠿ 雷达</span><button id="dock" title="停靠到屏幕顶部">⌃</button><button id="assistant" aria-label="打开音乐助手" title="音乐助手">✧ AI</button><button id="open" title="打开完整窗口">↗</button></div><div class="track"><div id="cover" class="cover">♫</div><div><strong id="title">选择一首歌开始播放</strong><small id="artist">你的每日音乐</small></div></div><div id="lyric" class="floating-lyric">播放后显示歌词</div><div class="timeline"><span id="elapsed">0:00</span><input id="seek" aria-label="播放进度" type="range" min="0" max="1" step="0.1" value="0"><span id="duration">0:00</span></div><div class="controls"><button id="mode" title="顺序播放">→</button><button id="previous" title="上一首">⏮</button><button id="toggle" class="play" title="播放或暂停">▶</button><button id="next" title="下一首">⏭</button><button id="heart" title="收藏到指定歌单">♡</button></div><div id="message" class="message"></div><div id="suggestions" class="suggestions"></div></section><div id="bubble" class="bubble" title="雷达"><span>♫</span></div><script src="appearance.js"></script><script src="lyrics-format.js"></script><script src="floating.js"></script></body></html>
